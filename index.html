<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福建江夏学院 2025-2026学年第1学期 课表</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --line:#e6e8f0; --text:#334155; --muted:#8a93a6;
  --accent:#5b7cfa; --accent-soft:#eef1ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
header h1{font-size:16px;font-weight:600;color:#3b4568;white-space:nowrap}
header .sub{font-size:12px;color:var(--muted);white-space:nowrap}
#search{flex:1;min-width:160px;max-width:360px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;outline:none;background:#fff;color:var(--text)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#classSearch{width:130px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;outline:none;background:#fff;color:var(--text);flex:0 0 auto}
#classSearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text);cursor:pointer}
.layout{display:flex;flex:1;min-height:0;overflow:hidden}
#sidebar{width:230px;flex-shrink:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 30px}
.major>.mtitle{padding:9px 14px;font-size:13px;font-weight:600;color:#4a5578;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.major>.mtitle:hover{background:var(--accent-soft)}
.major>.mtitle .arrow{font-size:10px;color:var(--muted);transition:transform .2s}
.major.collapsed .arrow{transform:rotate(-90deg)}
.major.collapsed .clist{display:none}
.clist button{display:block;width:100%;text-align:left;padding:7px 14px 7px 24px;border:none;background:none;font-size:13px;color:var(--text);cursor:pointer;border-left:3px solid transparent}
.clist button:hover{background:var(--accent-soft)}
.clist button.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
#main{flex:1;overflow:auto;padding:14px;min-width:0}
#clsTitle{font-size:17px;font-weight:600;color:#3b4568;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:78px repeat(7,minmax(118px,1fr));gap:4px;min-width:872px}
.hcell,.pcell{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#4a5578;font-weight:600;padding:5px 2px}
.pcell{flex-direction:column;gap:2px}
.ptime{font-size:10px;color:var(--muted);font-weight:400;white-space:nowrap}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 4px;min-height:68px;display:flex;flex-direction:column;gap:3px}
.course{border-radius:5px;padding:4px 5px;font-size:11px;line-height:1.4;transition:opacity .15s, box-shadow .15s}
.course .cn{font-weight:600;font-size:11px;margin-bottom:1px}
.course .ci{opacity:.85}
.course.dim{opacity:.18}
.course.hit{box-shadow:0 0 0 2px var(--accent)}
#overlay{display:none;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35)}
#overlay.show{display:block}
@media (max-width: 768px){#classSearch{width:105px;font-size:12px;padding:6px 10px}
  #menuBtn{display:block;font-size:14px;padding:5px 12px}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;width:250px;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 24px rgba(0,0,0,.15);border-radius:0 12px 12px 0}
  #sidebar.open{transform:translateX(0)}
  #main{padding:8px}
  .grid{min-width:872px}
  header h1{font-size:14px}
  header .sub{display:none}
  #search{min-width:100px;max-width:180px;font-size:12px;padding:6px 10px}
  .hcell,.pcell{font-size:10px;padding:4px 1px}
  .cell{min-height:58px;padding:2px 3px;gap:2px}
  .course{font-size:10px;padding:3px 4px;line-height:1.35}
  .course .cn{font-size:10px}
}

#qrBtn{position:fixed;bottom:20px;right:20px;z-index:50;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .2s,box-shadow .2s}
#qrBtn:hover{transform:scale(1.08);box-shadow:0 4px 18px rgba(0,0,0,.18)}
#qrModal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#qrModal.show{display:flex}
#qrModal .modal-box{background:#fff;border-radius:14px;padding:24px 20px 18px;text-align:center;max-width:300px;width:90%;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.18);animation:qrFadeIn .25s ease}
@keyframes qrFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#qrModal .modal-box img{width:100%;max-width:240px;border-radius:8px;display:block;margin:0 auto}
#qrModal .modal-box .qr-tip{font-size:13px;color:var(--muted);margin-top:10px}
#qrModal .modal-close{position:absolute;top:8px;right:12px;border:none;background:none;font-size:20px;color:#999;cursor:pointer;line-height:1;padding:4px}
@media(max-width:768px){#qrBtn{bottom:14px;right:14px;width:40px;height:40px;font-size:20px}}
</style>
</head>

var colorMap={}, colorIdx=0;
function colorOf(n){if(!(n in colorMap)){colorMap[n]=PALETTE[colorIdx%PALETTE.length];colorIdx++;}return colorMap[n];}
var current=0, sidebar=document.getElementById("sidebar");

DATA.majors.forEach(function(m){
  var d=document.createElement("div");d.className="major";
  var t=document.createElement("div");t.className="mtitle";
  t.innerHTML='<span>'+h(m.name)+'（'+m.idx.length+'）</span><span class="arrow">&#9660;</span>';
  t.onclick=function(){d.classList.toggle("collapsed")};
  d.appendChild(t);
  var l=document.createElement("div");l.className="clist";
  m.idx.forEach(function(i){
    var b=document.createElement("button");
    b.textContent=DATA.classes[i].name.replace(/^.*?【/,"【");
    b.title=DATA.classes[i].name;b.dataset.idx=i;
    b.onclick=function(){selectClass(i);if(window.innerWidth<=768)closeSidebar()};
    l.appendChild(b);
  });
  d.appendChild(l);sidebar.appendChild(d);
});

function selectClass(i){
  current=i;
  document.querySelectorAll(".clist button").forEach(function(b){
    var on=+b.dataset.idx===i;
    b.classList.toggle("active",on);
    if(on){var mj=b.closest(".major");if(mj.classList.contains("collapsed"))mj.classList.remove("collapsed");b.scrollIntoView({block:"nearest"})}
  });
  render();
}

function render(){
  var cls=DATA.classes[current];
  document.getElementById("clsTitle").textContent=cls.name;
  var grid=document.getElementById("grid");grid.innerHTML="";
  grid.appendChild(el("hcell","节次"));
  DAYS.forEach(function(d){grid.appendChild(el("hcell",d))});
  var mat=PERIODS.map(function(){return DAYS.map(function(){return[]})});
  cls.courses.forEach(function(c){
    var di=DAYS.indexOf(c.d);if(di<0||c.r==null)return;
    c.items.forEach(function(it){mat[c.r][di].push(it)});
  });
  PERIODS.forEach(function(p,ri){
    grid.appendChild(elTime(p,TIMES[ri]));
    DAYS.forEach(function(d,di){
      var cell=document.createElement("div");cell.className="cell";
      mat[ri][di].forEach(function(it){
        var cs=colorOf(it.n),div=document.createElement("div");div.className="course";
        div.style.background=cs[0];div.style.color=cs[1];
        div.innerHTML='<div class="cn">'+h(it.n)+'</div><div class="ci">'+h(it.w)+'</div><div class="ci">'+h(it.p)+(it.t?" &#183; "+h(it.t):"")+'</div>';
        div.dataset.text=(it.n+" "+it.w+" "+it.p+" "+it.t).toLowerCase();
        cell.appendChild(div);
      });
      grid.appendChild(cell);
    });
  });
  applySearch();
}
function el(c,t){var d=document.createElement("div");d.className=c;d.textContent=t;return d}
function elTime(p,t){var d=document.createElement("div");d.className="pcell";d.innerHTML="<div>"+p+"节</div><div class=\"ptime\">"+t+"</div>";return d}
function h(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

var sb=document.getElementById("search");
sb.addEventListener("input",applySearch);
function applySearch(){
  var q=sb.value.trim().toLowerCase();
  document.querySelectorAll(".course").forEach(function(c){
    if(!q){c.classList.remove("dim","hit");return}
    if(c.dataset.text.indexOf(q)!==-1){c.classList.add("hit");c.classList.remove("dim")}
    else{c.classList.add("dim");c.classList.remove("hit")}
  });
}
var ov=document.getElementById("overlay");
function openSidebar(){sidebar.classList.add("open");ov.classList.add("show")}
function closeSidebar(){sidebar.classList.remove("open");ov.classList.remove("show")}
var cs=document.getElementById("classSearch");
cs.addEventListener("input",function(){
  var q=cs.value.trim().toLowerCase();
  document.querySelectorAll("#sidebar .major").forEach(function(mj){
    var vis=false;
    mj.querySelectorAll(".clist button").forEach(function(b){
      var txt=(b.textContent+" "+(b.title||"")).toLowerCase();
      if(!q||txt.indexOf(q)!==-1){b.style.display="";vis=true}else{b.style.display="none"}
    });
    mj.style.display=vis?"":"none";
    if(vis&&q)mj.classList.remove("collapsed");
  });
});
