var Q={show:function(){document.getElementById('qrModal').classList.remove('hidden')},hide:function(){document.getElementById('qrModal').classList.add('hidden')}};
function E(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function A(s){return(s||'').replace(/'/g,"\'").replace(/"/g,'&quot;')}
function R(){var a=document.getElementById('app'),g={},h='';
ALL.forEach(function(c){var m=c.major||'其他';m=m.replace(/【本科】/g,'').replace(/（专升本）/g,'').replace(/（闽台合作.+?）/g,'').trim();if(!g[m])g[m]=[];g[m].push(c)});
h='<div class="search-box"><input type="text" id="filterInput" placeholder="搜索班级名称..." oninput="F()"></div>';
Object.keys(g).sort().forEach(function(m){var items=g[m];h+='<div class="major-group" data-major="'+E(m)+'"><div class="major-title">'+E(m)+' <small style="font-weight:400;color:#95a5a6;">'+items.length+'个班</small></div><div class="class-grid">';
items.forEach(function(c){h+='<div class="class-card" data-name="'+E(c.name)+'" onclick="S(\''+A(c.name)+'\')"><div class="name">'+E(c.name)+'</div><span class="badge">'+c.count+'门课程</span></div>'});
h+='</div></div>'});
h+='<p style="text-align:center;color:#bdc3c7;font-size:.72rem;margin-top:16px">共 '+ALL.length+' 个班级 · 福建江夏学院</p>';
a.innerHTML=h}
function F(){var k=document.getElementById('filterInput').value.trim().toLowerCase();
document.querySelectorAll('.major-group').forEach(function(g){var m=false;g.querySelectorAll('.class-card').forEach(function(c){var v=!k||(c.dataset.name||'').toLowerCase().indexOf(k)>=0;c.classList.toggle('hidden',!v);if(v)m=true});g.classList.toggle('hidden',!m)});
var nr=document.getElementById('noResult'),any=!!document.querySelector('.major-group:not(.hidden)');
if(!any&&k){if(!nr){nr=document.createElement('div');nr.id='noResult';nr.className='no-result';nr.textContent='未找到匹配的班级';document.getElementById('app').appendChild(nr)}nr.classList.remove('hidden')}else if(nr)nr.classList.add('hidden')}
function S(n){var a=document.getElementById('app'),cs=SCHEDULES[n],days=['周一','周二','周三','周四','周五','周六','周日'];
if(!cs){a.innerHTML='<div class="no-course">暂无数据</div>';return}
var h='<button class="back-btn" onclick="R()">返回班级列表</button><div class="view-title">'+E(n)+' 课表</div>';
days.forEach(function(d){var fc=cs.filter(function(c){return c.d===d});h+='<div class="day-block"><span class="day-label">'+d+'</span>';
if(!fc.length)h+='<div class="no-course">暂无课程</div>';
else fc.forEach(function(c){h+='<div class="course-row"><div class="time-col">'+E(c.p)+'<br><small>'+E(c.t)+'</small></div><div class="info-col"><div class="c-name">'+E(c.n)+'</div><div class="c-detail">'+E(c.w)+'</div></div><div class="room-tag">'+E(c.r)+'</div></div>'});
h+='</div>'});a.innerHTML=h}
R();
(function initQr(){
  try {
    if(!sessionStorage.getItem('qs')){
      var el = document.getElementById('qrModal');
      if(el) {
        el.classList.remove('hidden');
        sessionStorage.setItem('qs','1');
      }
    }
  } catch(e) {}
})();
