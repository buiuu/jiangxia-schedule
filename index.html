// Period mapping
function getSlotIdx(period) {
    var slots = {'1-2':0,'3-4':1,'5-6':2,'7-8':3,'9-10':4,'11-13':5};
    if (slots[period] !== undefined) return slots[period];
    var start = parseInt(period.split('-')[0]);
    if (start <= 2) return 0;
    if (start <= 4) return 1;
    if (start <= 6) return 2;
    if (start <= 8) return 3;
    if (start <= 10) return 4;
    return 5;
}

// Build sidebar
function buildSidebar(filter) {
    var html = '';
    var majorKeys = Object.keys(GROUPS).sort();
    for (var i = 0; i < majorKeys.length; i++) {
        var major = majorKeys[i];
        var classes = GROUPS[major];
        if (filter) {
            var hasMatch = false;
            for (var j = 0; j < classes.length; j++) {
                if (classes[j].toLowerCase().indexOf(filter) > -1) { hasMatch = true; break; }
                // also check course data
                var crs = DATA[classes[j]];
                if (crs) {
                    for (var k = 0; k < crs.length; k++) {
                        var c = crs[k];
                        if ((c.cn||'').toLowerCase().indexOf(filter)>-1 || (c.t||'').toLowerCase().indexOf(filter)>-1 || (c.l||'').toLowerCase().indexOf(filter)>-1) {
                            hasMatch = true; break;
                        }
                    }
                }
            }
            if (!hasMatch) continue;
        }
        html += '<div class="major-group">';
        html += '<div class="major-name" onclick="this.classList.toggle('collapsed'); var ul=this.nextElementSibling; ul.style.display=ul.style.display==='none'?'block':'none';"><span>'+major+'</span><span class="arrow">&#9660;</span></div>';
        html += '<ul class="class-list">';
        for (var j = 0; j < classes.length; j++) {
            var cn = classes[j];
            var activeClass = (cn === currentClass) ? ' active' : '';
            html += '<li class="'+activeClass+'" onclick="selectClass(''+cn.replace(/'/g,"\'")+'')">'+cn+'</li>';
        }
        html += '</ul></div>';
    }
    document.getElementById('classList').innerHTML = html || '<div style="padding:20px;color:#aaa;text-align:center;">无匹配班级</div>';
}

// Select class
function selectClass(className) {
    currentClass = className;
    buildSidebar(searchFilter.toLowerCase());
    renderSchedule(className);
}

// Render schedule grid
function renderSchedule(className) {
    var courses = DATA[className];
    if (!courses) { document.getElementById('content').innerHTML = '<div class="empty-state"><div>暂无数据</div></div>'; return; }

    // Build grid
    var grid = {}; // "si-dj" -> [courses]
    for (var i = 0; i < courses.length; i++) {
        var c = courses[i];
        var si = getSlotIdx(c.p);
        var key = si + '-' + c.d;
        if (!grid[key]) grid[key] = [];
        grid[key].push(c);
    }

    var filter = searchFilter.toLowerCase();

    var html = '<div class="class-title">'+className+'</div>';
    html += '<div class="class-info">共 '+courses.length+' 条课程记录</div>';
    html += '<div class="schedule-grid">';
    html += '<div class="grid-period"></div>';
    for (var d = 0; d < 7; d++) {
        html += '<div class="grid-header">'+DAY_LABELS[d]+'</div>';
    }
    for (var si = 0; si < 6; si++) {
        html += '<div class="grid-period">'+PERIOD_LABELS[si]+'</div>';
        for (var dj = 0; dj < 7; dj++) {
            var key = si + '-' + dj;
            var cellCourses = grid[key] || [];
            html += '<div class="grid-cell">';
            if (cellCourses.length === 0) {
                html += '<div class="no-course"></div>';
            } else {
                for (var ci = 0; ci < cellCourses.length; ci++) {
                    var c = cellCourses[ci];
                    var color = COLORS[c.cn] || '#e8e8e8';
                    var textMatch = (c.cn||'').toLowerCase().indexOf(filter)>-1 || (c.t||'').toLowerCase().indexOf(filter)>-1 || (c.l||'').toLowerCase().indexOf(filter)>-1;
                    var mutedClass = (filter && !textMatch) ? ' muted' : '';
                    html += '<div class="course-block'+mutedClass+'" style="background:'+color+'" title="'+c.cn+'('+c.cd+') 周数:'+c.w+' 地点:'+c.l+' 教师:'+c.t+'">';
                    html += '<div class="cname">'+c.cn+'</div>';
                    html += '<div class="cinfo"><span>'+c.w+'</span><span>'+c.l+' | '+c.t+'</span></div>';
                    html += '</div>';
                }
            }
            html += '</div>';
        }
    }
    html += '</div>';
    html += '<div class="legend"><span>不同课程用不同底色区分</span><span>搜索后不匹配项会淡化显示</span></div>';
    document.getElementById('content').innerHTML = html;
}

// Search handler
document.getElementById('searchInput').addEventListener('input', function() {
    searchFilter = this.value;
    document.getElementById('searchInfo').textContent = searchFilter ? '搜索: '+searchFilter : '';
    buildSidebar(searchFilter.toLowerCase());
    if (currentClass) renderSchedule(currentClass);
});

// Init
buildSidebar('');
</script>
</body>
</html>
